  <h1>なぜ ADHD アプリなのか</h1>

  <p>市場規模で選んでいない。身近に困っている人がいて、既存のアプリが「大人の道具」すぎた。それだけが理由だ。</p>

  <h2><span class="sec">§1</span>ニッチに見えて、普遍</h2>
  <p>子どもが自分から動き出す瞬間を作りたかった。やらせるのではなく、動きたくなる設計。これは習慣化という、誰にでも効く普遍の問題に触れている。</p>

  <blockquote>遊び × やる事 = 習慣。</blockquote>

  <p>狭いところを深く掘ると、たいてい広い水脈に当たる。</p>

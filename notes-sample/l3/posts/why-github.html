  <h1>なぜ GitHub に賭けたか</h1>
  <p>個人開発の一番の弱点は属人化だ。自分が倒れたら全部止まる。だから、履歴と自動化を一箇所に集めて、未来の自分への引き継ぎ書にした。</p>
  <h2>手作業を構造で殺す</h2>
  <p>デプロイを手でやっている限り、いつか手が滑る。ワークフローに握らせれば、ミスは構造的に減る。</p>
  <ul class="body"><li>履歴 = 過去の自分の判断の記録</li><li>自動化 = 未来の自分の代わりに働く手</li><li>課題管理 = 忘れてもいい場所</li></ul>

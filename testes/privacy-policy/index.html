<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Privacy Policy — Lyco App</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Lyco App Privacy Policy" />
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="../favicon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png" />
<style>
  body { font-family: system-ui, sans-serif; background: #FBF6EE; color: #3D2E1F; padding: 40px 20px; text-align: center; }
  a { color: #E89A3D; }
</style>
</head>
<body>

<!--
  ============================================================
   /privacy-policy/ — UA 判定リダイレクタ
  ============================================================
   - Accept-Language を見て /privacy-policy/<lang>/ にリダイレクト
   - localStorage に保存された言語があればそれを優先
   - 未対応言語は ja にフォールバック (一時的・en 追加時に変更)
  ============================================================
-->

<noscript>
  <p>Please enable JavaScript, or go to <a href="ja/">日本語版</a>.</p>
</noscript>

<p id="msg">Redirecting…</p>

<script src="../shared/langs.js"></script>
<script>
(function () {
  var saved = null;
  try { saved = localStorage.getItem("lp_lang"); } catch (e) {}
  var lang;
  if (saved && window.LANGS.some(function (l) { return l.code === saved; })) {
    lang = saved;
  } else {
    lang = window.matchLang(navigator.languages ? navigator.languages.join(",") : navigator.language);
  }
  // /privacy-policy/<lang>/ がまだ作られていない言語は ja にフォールバック
  // (将来 en/de/... を追加したらここに足す)
  var EXISTING = ["ja"];
  if (EXISTING.indexOf(lang) === -1) {
    var primary = lang.split("-")[0];
    if (EXISTING.indexOf(primary) >= 0) lang = primary; else lang = "ja";
  }
  // 相対リダイレクトにすることで /testes/ 配下でも本番でも動く。
  location.replace(lang + "/");
})();
</script>

</body>
</html>

<!doctype html>
<html lang="kn-IN">
<head>
<meta charset="utf-8" />
<title>ಗೌಪ್ಯತೆ ನೀತಿ — Lyco App</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Lyco ಆ್ಯಪ್‌ಗಳ ಸಾಮಾನ್ಯ ಗೌಪ್ಯತೆ ನೀತಿ. ನಾವು ಜಾಹೀರಾತು ಗುರುತುಗಳನ್ನು ಸಂಗ್ರಹಿಸುವುದಿಲ್ಲ; ನಿಮ್ಮ ಡೇಟಾ ಸಾಧನದಲ್ಲೇ ಉಳಿಯುತ್ತದೆ." />
<link rel="stylesheet" href="../../shared/motion.css" />
<style>
  body { margin: 0; font-family: "Helvetica Neue", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif; background: #FBF6EE; color: #3D2E1F; }
  * { box-sizing: border-box; }
  .site-header-inner { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; gap: 12px; max-width: 1200px; margin: 0 auto; }
  .site-nav { flex: 1; justify-content: center; }
  @media (max-width: 900px) {
    .site-nav { display: none !important; }
    .site-menu-btn { display: block !important; }
  }
  .reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.visible { opacity: 1; transform: none; }
</style>
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32.png" />

</head>
<body>

<!-- 言語メタ -->
<script src="../../shared/langs.js"></script>

<!-- コンテンツ (SiteHeader/SiteFooter が I18N を参照するため必要) -->
<script src="../../content/ja/common.js"></script>
<script src="../../content/ja/todo.js"></script>
<script src="../../content/ja/record.js"></script>

<script>window.__CONTENT__ = window.__CONTENT__ || {}; window.__CONTENT__._fb_lang = "ja";</script>
<script src="../../content/ja/common.js"></script>
<script src="../../content/ja/todo.js"></script>
<script src="../../content/ja/record.js"></script>
<script src="../../content/ja/tool.js"></script>
<script src="../../content/ja/other.js"></script>

<script src="../../shared/i18n-loader.js"></script>

<!-- 共通コンポーネント -->
<script type="text/babel" src="../../shared/site-shared.jsx"></script>

<!-- ページ本体 -->
<script type="text/babel" data-presets="env,react">

const { createRoot } = ReactDOM;
// SiteHeader/SiteFooter は pathPrefix を「言語ホームへの相対」として使う
// (画像は ${pathPrefix}../images/...、privacy-policy は ${pathPrefix}../privacy-policy/)。
// /privacy-policy/ja/index.html から /ja/ 言語ホームに戻るには ../../ja/
const PREFIX = "../../kn-IN/";
const ACCENT = "#E89A3D";
const ACCENT_DEEP = "#8B5A1A";

function Card({ label, children }) {
  return (
    <section className="reveal" style={{ padding: "0 18px", maxWidth: 640, margin: "28px auto" }}>
      <div style={{
        position: "relative",
        border: `2px solid ${ACCENT}`,
        borderRadius: 16,
        padding: "32px 24px 24px",
        background: "#fff",
      }}>
        <div style={{ position: "absolute", top: -11, left: 20, pointerEvents: "none" }}>
          <span style={{
            display: "inline-block",
            background: "#FBF6EE",
            padding: "2px 14px",
            borderRadius: 999,
            fontSize: 13, fontWeight: 800, letterSpacing: 3,
            color: ACCENT_DEEP,
          }}>{label}</span>
        </div>
        {children}
      </div>
    </section>
  );
}

function Promise3() {
  // 冒頭の "3つの約束" ハイライト
  const items = [
    { k: "01", t: "ನಾವು ಜಾಹೀರಾತು ಗುರುತು (IDFA) ಸಂಗ್ರಹಿಸುವುದಿಲ್ಲ", d: "ನಿಮ್ಮ ಆ್ಯಪ್ ಬಳಕೆ ಯಾವುದೇ ಜಾಹೀರಾತು ನೆಟ್‌ವರ್ಕ್‌ಗೆ ಜೋಡಿಸಲ್ಪಡುವುದಿಲ್ಲ." },
    { k: "02", t: "ನಿಮ್ಮ ಡೇಟಾ ಸಾಧನದಲ್ಲೇ ಉಳಿಯುತ್ತದೆ", d: "ದಾಖಲೆಗಳು ಮತ್ತು ಸೆಟ್ಟಿಂಗ್‌ಗಳು ಸಾಧನದಲ್ಲಿ ಮಾತ್ರ ಉಳಿಸಲ್ಪಡುತ್ತವೆ, ಬಾಹ್ಯ ಸರ್ವರ್‌ಗಳಿಗೆ ಎಂದಿಗೂ ಕಳುಹಿಸಲಾಗುವುದಿಲ್ಲ." },
    { k: "03", t: "ಸಂಗ್ರಹಿಸದಂತೆ ವಿನ್ಯಾಸಗೊಂಡಿದೆ", d: "ಸೌಲಭ್ಯಕ್ಕಾಗಿ ಡೇಟಾ ವಿನಿಮಯವಲ್ಲ — ಡೇಟಾ ಸಂಗ್ರಹವಿಲ್ಲದೆ ಕೆಲಸ ಮಾಡುವ ಆ್ಯಪ್‌ಗಳನ್ನು ನಾವು ಕಟ್ಟುತ್ತೇವೆ." },
  ];
  return (
    <section className="reveal" style={{ padding: "0 18px", maxWidth: 640, margin: "32px auto 8px" }}>
      <div style={{
        background: "linear-gradient(180deg, #FFF8EC 0%, #FFEFD4 100%)",
        border: `2px solid ${ACCENT}`,
        borderRadius: 18,
        padding: "26px 22px 22px",
      }}>
        <div style={{ textAlign: "center", marginBottom: 18 }}>
          <div style={{ fontSize: 11, letterSpacing: 4, fontWeight: 800, color: ACCENT_DEEP, marginBottom: 6 }}>— ನಮ್ಮ 3 ವಚನಗಳು —</div>
          <div style={{ fontSize: 18, fontWeight: 900, color: "#3D2E1F", lineHeight: 1.5 }}>
            ನಿಮ್ಮ ಶಾಂತಿಗಾಗಿ,<br />
            <span style={{ color: ACCENT_DEEP }}>ನಾವು ಬದ್ಧತೆ ತೋರುವುದು</span>
          </div>
        </div>
        <ul style={{ listStyle: "none", padding: 0, margin: 0, display: "flex", flexDirection: "column", gap: 12 }}>
          {items.map((it) => (
            <li key={it.k} style={{
              display: "flex", gap: 14, alignItems: "flex-start",
              padding: "12px 14px", background: "#fff", borderRadius: 12,
              boxShadow: "0 1px 3px rgba(0,0,0,0.05)",
            }}>
              <span style={{
                flex: "0 0 auto",
                fontFamily: "ui-monospace, monospace",
                fontSize: 11, fontWeight: 800, letterSpacing: 1,
                color: "#fff", background: ACCENT,
                padding: "3px 8px", borderRadius: 6,
              }}>{it.k}</span>
              <div>
                <div style={{ fontSize: 14, fontWeight: 800, color: "#3D2E1F", marginBottom: 2 }}>{it.t}</div>
                <div style={{ fontSize: 12.5, color: "#5C4936", lineHeight: 1.6 }}>{it.d}</div>
              </div>
            </li>
          ))}
        </ul>
      </div>
    </section>
  );
}

function Page() {
  return (
    <>
      <window.SiteHeader pathPrefix={PREFIX} currentCategoryId="todo" />

      {/* HERO */}
      <section className="reveal" style={{
        background: "#2C2218", color: "#FBF6EE",
        padding: "36px 20px 30px", textAlign: "center",
      }}>
        <div style={{ maxWidth: 720, margin: "0 auto" }}>
          <h1 style={{ margin: "0 0 8px", fontSize: 26, fontWeight: 900, letterSpacing: 1 }}>ಗೌಪ್ಯತೆ ನೀತಿ</h1>
          <p style={{ margin: 0, fontSize: 13, opacity: 0.7 }}>ಎಲ್ಲ Lyco ಆ್ಯಪ್‌ಗಳಿಗಾಗಿ</p>
        </div>
      </section>

      {/* 3つの約束 (冒頭ハイライト) */}
      <Promise3 />

      {/* 詳細セクション */}
      <main style={{ paddingBottom: 48 }}>
        <Card label="ವ್ಯಾಪ್ತಿ">
          <p style={{ margin: 0, fontSize: 14, color: "#5C4936", lineHeight: 1.85 }}>
            ಈ ನೀತಿ Lyco App ಒದಗಿಸುವ ಎಲ್ಲ ಆ್ಯಪ್‌ಗಳಿಗೆ ಅನ್ವಯವಾಗುತ್ತದೆ. ಪ್ರತಿ ಆ್ಯಪ್‌ನ App Store ಪುಟದಿಂದ ಲಿಂಕ್ ಆಗಿರುವ ಈ ಪುಟ ಆ ಆ್ಯಪ್‌ನ ಗೌಪ್ಯತೆ ನೀತಿಯಾಗಿಯೂ ಕಾರ್ಯನಿರ್ವಹಿಸುತ್ತದೆ.
          </p>
        </Card>

        <Card label="ಸಂಗ್ರಹಿಸುವ ಮಾಹಿತಿ">
          <ul style={{ margin: 0, paddingLeft: 20, color: "#5C4936", fontSize: 14, lineHeight: 1.85 }}>
            <li>ಆ್ಯಪ್ ಸೆಟ್ಟಿಂಗ್‌ಗಳು, ಪ್ರಗತಿ ಮತ್ತು ದಾಖಲೆಗಳು ನಿಮ್ಮ ಸಾಧನದಲ್ಲಿ ಮಾತ್ರ ಉಳಿಯುತ್ತವೆ.</li>
            <li>ಈ ಡೇಟಾ ನಮ್ಮ ಸರ್ವರ್‌ಗಳಿಗೆ ಅಥವಾ ಯಾವುದೇ ಬಾಹ್ಯ ಸೇವೆಗೆ ಎಂದಿಗೂ ಕಳುಹಿಸಲ್ಪಡುವುದಿಲ್ಲ.</li>
            <li>ವೈಯಕ್ತಿಕ ಗುರುತಿಸುವ ಮಾಹಿತಿ (ಹೆಸರು, ಇಮೇಲ್, ಫೋನ್ ಇತ್ಯಾದಿ) ಸಂಗ್ರಹಿಸುವುದಿಲ್ಲ.</li>
          </ul>
        </Card>

        <Card label="ಜಾಹೀರಾತುಗಳ ಬಗ್ಗೆ">
          <ul style={{ margin: 0, paddingLeft: 20, color: "#5C4936", fontSize: 14, lineHeight: 1.85 }}>
            <li>ಮಕ್ಕಳಿಗಾಗಿನ ಆ್ಯಪ್‌ಗಳು ಯಾವುದೇ ಜಾಹೀರಾತು ತೋರಿಸುವುದಿಲ್ಲ.</li>
            <li>ಬೇರೆ ಆ್ಯಪ್‌ಗಳಲ್ಲಿ Google AdMob ಜಾಹೀರಾತುಗಳು ಪೋಷಕರ ನಿರ್ವಹಣಾ ಪರದೆಯಲ್ಲಿ ಮಾತ್ರ ಕಾಣಿಸಿಕೊಳ್ಳಬಹುದು, ಮಗು ಬಳಸುವ ಪರದೆಯಲ್ಲಿ ಎಂದಿಗೂ ಅಲ್ಲ.</li>
            <li>AdMob ಜೊತೆಗೂ ನಮ್ಮ ಆ್ಯಪ್‌ಗಳು ಜಾಹೀರಾತು ಗುರುತು (IDFA) ರವಾನಿಸದಂತೆ ಕಾನ್ಫಿಗರ್ ಆಗಿವೆ.</li>
          </ul>
        </Card>

        <Card label="ವಿಶ್ಲೇಷಣೆ ಮತ್ತು ಟ್ರ್ಯಾಕಿಂಗ್">
          <ul style={{ margin: 0, paddingLeft: 20, color: "#5C4936", fontSize: 14, lineHeight: 1.85 }}>
            <li>ಮಕ್ಕಳ ಆ್ಯಪ್‌ಗಳಲ್ಲಿ ಯಾವುದೇ ವಿಶ್ಲೇಷಣೆ ಅಥವಾ ಟ್ರ್ಯಾಕಿಂಗ್ ಬಳಸುವುದಿಲ್ಲ.</li>
            <li>ಇತರ ಆ್ಯಪ್‌ಗಳಲ್ಲಿ ಕೇವಲ Apple ನ ಅನಾಮಿಕ ಅಂಕಿಅಂಶಗಳನ್ನು — ಸಮಸ್ಯೆ ಗುರುತಿಸಲು ಮತ್ತು ಗುಣಮಟ್ಟ ಸುಧಾರಣೆಗೆ, ವೈಯಕ್ತಿಕ ಮಾಹಿತಿ ಇಲ್ಲದೆ.</li>
          </ul>
        </Card>

        <Card label="ಮೂರನೇ ಪಕ್ಷದ ಜೊತೆ ಹಂಚಿಕೆ">
          <p style={{ margin: 0, fontSize: 14, color: "#5C4936", lineHeight: 1.85 }}>
            ನಿಮ್ಮ ಮಾಹಿತಿಯನ್ನು ಮಾರಾಟ ಅಥವಾ ಮೂರನೇ ಪಕ್ಷಗಳ ಜೊತೆ ಹಂಚಿಕೊಳ್ಳುವುದಿಲ್ಲ.
          </p>
        </Card>

        <Card label="ಸಂಪರ್ಕ">
          <p style={{ margin: 0, fontSize: 14, color: "#5C4936", lineHeight: 1.85 }}>
            ಪ್ರಶ್ನೆ ಅಥವಾ ವಿನಂತಿಗಾಗಿ <strong style={{ color: "#3D2E1F" }}>lycopenecafei+LP@gmail.com</strong> ಗೆ ಸಂಪರ್ಕಿಸಿ. ಯಾವುದೇ ಆ್ಯಪ್‌ನ App Store ಪುಟದ ಮೂಲಕವೂ ಸಂಪರ್ಕಿಸಬಹುದು.
          </p>
        </Card>

        <Card label="ನವೀಕರಣಗಳು">
          <p style={{ margin: "0 0 8px", fontSize: 14, color: "#5C4936", lineHeight: 1.85 }}>
            ಅಗತ್ಯವಿದ್ದಾಗ ಈ ನೀತಿಯನ್ನು ನವೀಕರಿಸಬಹುದು. ಪ್ರಮುಖ ಬದಲಾವಣೆಗಳನ್ನು ಈ ಪುಟದಲ್ಲಿ ತಿಳಿಸಲಾಗುತ್ತದೆ.
          </p>
          <p style={{ margin: 0, fontSize: 12, opacity: 0.55, fontVariantNumeric: "tabular-nums" }}>
            ಕೊನೆಯ ನವೀಕರಣ: 2026-05-11
          </p>
        </Card>
      </main>

      <window.SiteFooter pathPrefix={PREFIX} />
    </>
  );
}

createRoot(document.getElementById("root")).render(<Page />);

</script>

<script defer src="../../shared/analytics.js"></script>

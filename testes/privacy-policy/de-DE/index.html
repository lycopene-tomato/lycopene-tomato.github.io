<!doctype html>
<html lang="de-DE">
<head>
<meta charset="utf-8" />
<title>Datenschutzerklärung — Lyco App</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Datenschutzerklärung für alle Lyco-Apps. Wir erfassen keine Werbe-IDs; alle Daten bleiben auf deinem Gerät." />
<link rel="stylesheet" href="../../shared/motion.css" />
<style>
  body { margin: 0; font-family: "Helvetica Neue", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif; background: #FBF6EE; color: #3D2E1F; }
  * { box-sizing: border-box; }
  .site-header-inner { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; gap: 12px; max-width: 1200px; margin: 0 auto; }
  .site-nav { flex: 1; justify-content: center; }
  @media (max-width: 900px) {
    .site-nav { display: none !important; }
    .site-menu-btn { display: block !important; }
  }
  .reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.visible { opacity: 1; transform: none; }
</style>
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="../../favicon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png" />
</head>
<body>
<div id="root"></div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<!-- Motion -->
<script src="../../shared/motion.js" defer></script>

<!-- 言語メタ -->
<script src="../../shared/langs.js"></script>

<!-- コンテンツ (SiteHeader/SiteFooter が I18N を参照するため必要) -->
<script src="../../content/en-US/common.js"></script>
<script src="../../content/en-US/todo.js"></script>
<script src="../../content/en-US/record.js"></script>
<script src="../../content/en-US/tool.js"></script>
<script src="../../content/en-US/other.js"></script>
<script>window.__CONTENT__ = window.__CONTENT__ || {}; window.__CONTENT__._fb_lang = "en-US";</script>
<script src="../../content/en-US/common.js"></script>
<script src="../../content/en-US/todo.js"></script>
<script src="../../content/en-US/record.js"></script>
<script src="../../content/en-US/tool.js"></script>
<script src="../../content/en-US/other.js"></script>

<script src="../../shared/i18n-loader.js"></script>

<!-- 共通コンポーネント -->
<script type="text/babel" src="../../shared/site-shared.jsx"></script>

<!-- ページ本体 -->
<script type="text/babel" data-presets="env,react">

const { createRoot } = ReactDOM;
// SiteHeader/SiteFooter は pathPrefix を「言語ホームへの相対」として使う
// (画像は ${pathPrefix}../images/...、privacy-policy は ${pathPrefix}../privacy-policy/)。
// /privacy-policy/ja/index.html から /ja/ 言語ホームに戻るには ../../ja/
const PREFIX = "../../de-DE/";
const ACCENT = "#E89A3D";
const ACCENT_DEEP = "#8B5A1A";

function Card({ label, children }) {
  return (
    <section className="reveal" style={{ padding: "0 18px", maxWidth: 640, margin: "28px auto" }}>
      <div style={{
        position: "relative",
        border: `2px solid ${ACCENT}`,
        borderRadius: 16,
        padding: "32px 24px 24px",
        background: "#fff",
      }}>
        <div style={{ position: "absolute", top: -11, left: 20, pointerEvents: "none" }}>
          <span style={{
            display: "inline-block",
            background: "#FBF6EE",
            padding: "2px 14px",
            borderRadius: 999,
            fontSize: 13, fontWeight: 800, letterSpacing: 3,
            color: ACCENT_DEEP,
          }}>{label}</span>
        </div>
        {children}
      </div>
    </section>
  );
}

function Promise3() {
  // 冒頭の "3つの約束" ハイライト
  const items = [
    { k: "01", t: "Wir erfassen die Werbekennung (IDFA) nicht", d: "Deine Nutzung wird mit keinem Werbenetzwerk verknüpft." },
    { k: "02", t: "Deine Daten bleiben auf deinem Gerät", d: "Aufzeichnungen und Einstellungen werden ausschließlich lokal gespeichert und niemals an externe Server gesendet." },
    { k: "03", t: "Bewusst auf Datensammeln verzichtet", d: "Unsere Apps sind so gebaut, dass sie ohne Datensammlung funktionieren — nicht für bequeme Zusatzfunktionen." },
  ];
  return (
    <section className="reveal" style={{ padding: "0 18px", maxWidth: 640, margin: "32px auto 8px" }}>
      <div style={{
        background: "linear-gradient(180deg, #FFF8EC 0%, #FFEFD4 100%)",
        border: `2px solid ${ACCENT}`,
        borderRadius: 18,
        padding: "26px 22px 22px",
      }}>
        <div style={{ textAlign: "center", marginBottom: 18 }}>
          <div style={{ fontSize: 11, letterSpacing: 4, fontWeight: 800, color: ACCENT_DEEP, marginBottom: 6 }}>— Unsere 3 Versprechen —</div>
          <div style={{ fontSize: 18, fontWeight: 900, color: "#3D2E1F", lineHeight: 1.5 }}>
            Für deine Sicherheit,<br />
            <span style={{ color: ACCENT_DEEP }}>wozu wir uns verpflichten</span>
          </div>
        </div>
        <ul style={{ listStyle: "none", padding: 0, margin: 0, display: "flex", flexDirection: "column", gap: 12 }}>
          {items.map((it) => (
            <li key={it.k} style={{
              display: "flex", gap: 14, alignItems: "flex-start",
              padding: "12px 14px", background: "#fff", borderRadius: 12,
              boxShadow: "0 1px 3px rgba(0,0,0,0.05)",
            }}>
              <span style={{
                flex: "0 0 auto",
                fontFamily: "ui-monospace, monospace",
                fontSize: 11, fontWeight: 800, letterSpacing: 1,
                color: "#fff", background: ACCENT,
                padding: "3px 8px", borderRadius: 6,
              }}>{it.k}</span>
              <div>
                <div style={{ fontSize: 14, fontWeight: 800, color: "#3D2E1F", marginBottom: 2 }}>{it.t}</div>
                <div style={{ fontSize: 12.5, color: "#5C4936", lineHeight: 1.6 }}>{it.d}</div>
              </div>
            </li>
          ))}
        </ul>
      </div>
    </section>
  );
}

function Page() {
  return (
    <>
      <window.SiteHeader pathPrefix={PREFIX} currentCategoryId="todo" />

      {/* HERO */}
      <section className="reveal" style={{
        background: "#2C2218", color: "#FBF6EE",
        padding: "36px 20px 30px", textAlign: "center",
      }}>
        <div style={{ maxWidth: 720, margin: "0 auto" }}>
          <h1 style={{ margin: "0 0 8px", fontSize: 26, fontWeight: 900, letterSpacing: 1 }}>Datenschutzerklärung</h1>
          <p style={{ margin: 0, fontSize: 13, opacity: 0.7 }}>Für alle Lyco-Apps</p>
        </div>
      </section>

      {/* 3つの約束 (冒頭ハイライト) */}
      <Promise3 />

      {/* 詳細セクション */}
      <main style={{ paddingBottom: 48 }}>
        <Card label="GELTUNGSBEREICH">
          <p style={{ margin: 0, fontSize: 14, color: "#5C4936", lineHeight: 1.85 }}>
            Diese Erklärung gilt für alle von Lyco App bereitgestellten Apps. Diese Seite ist von der App-Store-Seite jeder App verlinkt und dient zugleich als deren Datenschutzerklärung.
          </p>
        </Card>

        <Card label="ERFASSTE INFORMATIONEN">
          <ul style={{ margin: 0, paddingLeft: 20, color: "#5C4936", fontSize: 14, lineHeight: 1.85 }}>
            <li>App-Einstellungen, Fortschritt und Aufzeichnungen werden ausschließlich auf deinem Gerät gespeichert.</li>
            <li>Diese Daten werden zu keinem Zeitpunkt an unsere Server oder externe Dienste übertragen.</li>
            <li>Wir erfassen keine personenbezogenen Daten (Name, E-Mail, Telefonnummer usw.).</li>
          </ul>
        </Card>

        <Card label="WERBUNG">
          <ul style={{ margin: 0, paddingLeft: 20, color: "#5C4936", fontSize: 14, lineHeight: 1.85 }}>
            <li>Für Kinder gedachte Apps zeigen keinerlei Werbung.</li>
            <li>Bei unseren übrigen Apps kann Google-AdMob-Werbung ausschließlich im Eltern-Verwaltungsbereich erscheinen — niemals auf Bildschirmen, die das Kind nutzt.</li>
            <li>Auch mit AdMob sind unsere Apps so konfiguriert, dass die Werbekennung (IDFA) nicht weitergegeben wird.</li>
          </ul>
        </Card>

        <Card label="ANALYSE & TRACKING">
          <ul style={{ margin: 0, paddingLeft: 20, color: "#5C4936", fontSize: 14, lineHeight: 1.85 }}>
            <li>Apps für Kinder verwenden keine Analyse- oder Tracking-Tools.</li>
            <li>Bei den übrigen Apps nutzen wir nur Apples anonymisierte Statistiken, um Fehler zu erkennen und Qualität zu verbessern — ohne personenbezogene Daten.</li>
          </ul>
        </Card>

        <Card label="WEITERGABE AN DRITTE">
          <p style={{ margin: 0, fontSize: 14, color: "#5C4936", lineHeight: 1.85 }}>
            Wir verkaufen deine Daten nicht und geben sie nicht an Dritte weiter.
          </p>
        </Card>

        <Card label="KONTAKT">
          <p style={{ margin: 0, fontSize: 14, color: "#5C4936", lineHeight: 1.85 }}>
            Bei Fragen oder Anliegen wende dich an <strong style={{ color: "#3D2E1F" }}>lycopenecafei+LP@gmail.com</strong>. Du erreichst uns auch über die App-Store-Seite jeder App.
          </p>
        </Card>

        <Card label="ÄNDERUNGEN">
          <p style={{ margin: "0 0 8px", fontSize: 14, color: "#5C4936", lineHeight: 1.85 }}>
            Wir können diese Erklärung bei Bedarf überarbeiten. Wesentliche Änderungen geben wir auf dieser Seite bekannt.
          </p>
          <p style={{ margin: 0, fontSize: 12, opacity: 0.55, fontVariantNumeric: "tabular-nums" }}>
            Zuletzt aktualisiert: 2026-05-11
          </p>
        </Card>
      </main>

      <window.SiteFooter pathPrefix={PREFIX} />
    </>
  );
}

createRoot(document.getElementById("root")).render(<Page />);

</script>

<script defer src="../../shared/analytics.js"></script>
</body>
</html>

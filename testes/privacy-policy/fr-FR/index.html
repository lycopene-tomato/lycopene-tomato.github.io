<!doctype html>
<html lang="fr-FR">
<head>
<meta charset="utf-8" />
<title>Politique de confidentialité — Lyco App</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Politique de confidentialité commune de Lyco App. Nous ne collectons pas d'identifiants publicitaires ; toutes vos données restent sur votre appareil." />
<link rel="stylesheet" href="../../shared/motion.css" />
<style>
  body { margin: 0; font-family: "Helvetica Neue", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif; background: #FBF6EE; color: #3D2E1F; }
  * { box-sizing: border-box; }
  .site-header-inner { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; gap: 12px; max-width: 1200px; margin: 0 auto; }
  .site-nav { flex: 1; justify-content: center; }
  @media (max-width: 900px) {
    .site-nav { display: none !important; }
    .site-menu-btn { display: block !important; }
  }
  .reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.visible { opacity: 1; transform: none; }
</style>
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="../../favicon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png" />
</head>
<body>
<div id="root"></div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<!-- Motion -->
<script src="../../shared/motion.js" defer></script>

<!-- 言語メタ -->
<script src="../../shared/langs.js"></script>

<!-- コンテンツ (SiteHeader/SiteFooter が I18N を参照するため必要) -->
<script src="../../content/en-US/common.js"></script>
<script src="../../content/en-US/todo.js"></script>
<script src="../../content/en-US/record.js"></script>
<script src="../../content/en-US/tool.js"></script>
<script src="../../content/en-US/other.js"></script>
<script>window.__CONTENT__ = window.__CONTENT__ || {}; window.__CONTENT__._fb_lang = "en-US";</script>
<script src="../../content/en-US/common.js"></script>
<script src="../../content/en-US/todo.js"></script>
<script src="../../content/en-US/record.js"></script>
<script src="../../content/en-US/tool.js"></script>
<script src="../../content/en-US/other.js"></script>

<script src="../../shared/i18n-loader.js"></script>

<!-- 共通コンポーネント -->
<script type="text/babel" src="../../shared/site-shared.jsx"></script>

<!-- ページ本体 -->
<script type="text/babel" data-presets="env,react">

const { createRoot } = ReactDOM;
// SiteHeader/SiteFooter は pathPrefix を「言語ホームへの相対」として使う
// (画像は ${pathPrefix}../images/...、privacy-policy は ${pathPrefix}../privacy-policy/)。
// /privacy-policy/ja/index.html から /ja/ 言語ホームに戻るには ../../ja/
const PREFIX = "../../fr-FR/";
const ACCENT = "#E89A3D";
const ACCENT_DEEP = "#8B5A1A";

function Card({ label, children }) {
  return (
    <section className="reveal" style={{ padding: "0 18px", maxWidth: 640, margin: "28px auto" }}>
      <div style={{
        position: "relative",
        border: `2px solid ${ACCENT}`,
        borderRadius: 16,
        padding: "32px 24px 24px",
        background: "#fff",
      }}>
        <div style={{ position: "absolute", top: -11, left: 20, pointerEvents: "none" }}>
          <span style={{
            display: "inline-block",
            background: "#FBF6EE",
            padding: "2px 14px",
            borderRadius: 999,
            fontSize: 13, fontWeight: 800, letterSpacing: 3,
            color: ACCENT_DEEP,
          }}>{label}</span>
        </div>
        {children}
      </div>
    </section>
  );
}

function Promise3() {
  // 冒頭の "3つの約束" ハイライト
  const items = [
    { k: "01", t: "Nous ne collectons pas l'identifiant publicitaire (IDFA)", d: "Votre utilisation de l'appli n'est jamais reliée à un réseau publicitaire." },
    { k: "02", t: "Vos données restent sur votre appareil", d: "Vos notes et réglages sont enregistrés sur votre appareil uniquement et ne sont jamais envoyés à un serveur externe." },
    { k: "03", t: "Conçu pour ne pas collecter", d: "Nous concevons nos applis pour fonctionner sans collecter d'informations, plutôt que d'en collecter pour ajouter du confort." },
  ];
  return (
    <section className="reveal" style={{ padding: "0 18px", maxWidth: 640, margin: "32px auto 8px" }}>
      <div style={{
        background: "linear-gradient(180deg, #FFF8EC 0%, #FFEFD4 100%)",
        border: `2px solid ${ACCENT}`,
        borderRadius: 18,
        padding: "26px 22px 22px",
      }}>
        <div style={{ textAlign: "center", marginBottom: 18 }}>
          <div style={{ fontSize: 11, letterSpacing: 4, fontWeight: 800, color: ACCENT_DEEP, marginBottom: 6 }}>— Our 3 Promises —</div>
          <div style={{ fontSize: 18, fontWeight: 900, color: "#3D2E1F", lineHeight: 1.5 }}>
            Pour votre tranquillité,<br />
            <span style={{ color: ACCENT_DEEP }}>voici ce que nous tenons</span>
          </div>
        </div>
        <ul style={{ listStyle: "none", padding: 0, margin: 0, display: "flex", flexDirection: "column", gap: 12 }}>
          {items.map((it) => (
            <li key={it.k} style={{
              display: "flex", gap: 14, alignItems: "flex-start",
              padding: "12px 14px", background: "#fff", borderRadius: 12,
              boxShadow: "0 1px 3px rgba(0,0,0,0.05)",
            }}>
              <span style={{
                flex: "0 0 auto",
                fontFamily: "ui-monospace, monospace",
                fontSize: 11, fontWeight: 800, letterSpacing: 1,
                color: "#fff", background: ACCENT,
                padding: "3px 8px", borderRadius: 6,
              }}>{it.k}</span>
              <div>
                <div style={{ fontSize: 14, fontWeight: 800, color: "#3D2E1F", marginBottom: 2 }}>{it.t}</div>
                <div style={{ fontSize: 12.5, color: "#5C4936", lineHeight: 1.6 }}>{it.d}</div>
              </div>
            </li>
          ))}
        </ul>
      </div>
    </section>
  );
}

function Page() {
  return (
    <>
      <window.SiteHeader pathPrefix={PREFIX} currentCategoryId="todo" />

      {/* HERO */}
      <section className="reveal" style={{
        background: "#2C2218", color: "#FBF6EE",
        padding: "36px 20px 30px", textAlign: "center",
      }}>
        <div style={{ maxWidth: 720, margin: "0 auto" }}>
          <h1 style={{ margin: "0 0 8px", fontSize: 26, fontWeight: 900, letterSpacing: 1 }}>Politique de confidentialité</h1>
          <p style={{ margin: 0, fontSize: 13, opacity: 0.7 }}>Pour toutes les applis Lyco</p>
        </div>
      </section>

      {/* 3つの約束 (冒頭ハイライト) */}
      <Promise3 />

      {/* 詳細セクション */}
      <main style={{ paddingBottom: 48 }}>
        <Card label="PORTÉE">
          <p style={{ margin: 0, fontSize: 14, color: "#5C4936", lineHeight: 1.85 }}>
            Cette politique s'applique à toutes les applis fournies par Lyco App. Cette page, liée depuis chaque fiche d'appli sur l'App Store, sert de politique de confidentialité pour cette appli.
          </p>
        </Card>

        <Card label="INFORMATIONS COLLECTÉES">
          <ul style={{ margin: 0, paddingLeft: 20, color: "#5C4936", fontSize: 14, lineHeight: 1.85 }}>
            <li>Réglages, progression et notes sont stockés uniquement sur votre appareil.</li>
            <li>Nous ne transmettons jamais ces données à nos serveurs ni à un service externe.</li>
            <li>Nous ne collectons pas d'informations personnelles identifiantes (nom, e-mail, téléphone, etc.).</li>
          </ul>
        </Card>

        <Card label="À PROPOS DES PUBS">
          <ul style={{ margin: 0, paddingLeft: 20, color: "#5C4936", fontSize: 14, lineHeight: 1.85 }}>
            <li>Les applis pensées pour les enfants ne montrent aucune pub.</li>
            <li>Pour les autres applis, des pubs Google AdMob peuvent apparaître uniquement sur l'écran de gestion des parents, jamais sur ceux utilisés par l'enfant.</li>
            <li>Même avec AdMob, nos applis sont configurées pour ne pas transmettre l'identifiant publicitaire (IDFA).</li>
          </ul>
        </Card>

        <Card label="ANALYSE & SUIVI">
          <ul style={{ margin: 0, paddingLeft: 20, color: "#5C4936", fontSize: 14, lineHeight: 1.85 }}>
            <li>Les applis enfants n'utilisent aucune analyse ni traçage.</li>
            <li>Pour les autres applis, nous n'utilisons que les statistiques anonymisées d'Apple pour repérer les bugs et améliorer, sans information personnelle identifiante.</li>
          </ul>
        </Card>

        <Card label="PARTAGE AVEC DES TIERS">
          <p style={{ margin: 0, fontSize: 14, color: "#5C4936", lineHeight: 1.85 }}>
            Nous ne vendons ni ne partageons jamais vos informations avec des tiers.
          </p>
        </Card>

        <Card label="CONTACT">
          <p style={{ margin: 0, fontSize: 14, color: "#5C4936", lineHeight: 1.85 }}>
            Pour toute question ou demande, écrivez-nous à <strong style={{ color: "#3D2E1F" }}>lycopenecafei+LP@gmail.com</strong>. Vous pouvez aussi nous contacter depuis la fiche de n'importe quelle appli sur l'App Store.
          </p>
        </Card>

        <Card label="RÉVISIONS">
          <p style={{ margin: "0 0 8px", fontSize: 14, color: "#5C4936", lineHeight: 1.85 }}>
            Nous pouvons réviser cette politique si nécessaire. Tout changement notable sera annoncé sur cette page.
          </p>
          <p style={{ margin: 0, fontSize: 12, opacity: 0.55, fontVariantNumeric: "tabular-nums" }}>
            Dernière mise à jour : 2026-05-11
          </p>
        </Card>
      </main>

      <window.SiteFooter pathPrefix={PREFIX} />
    </>
  );
}

createRoot(document.getElementById("root")).render(<Page />);

</script>

<script defer src="../../shared/analytics.js"></script>
</body>
</html>

<script type="text/babel" data-presets="env,react">

const { createRoot } = ReactDOM;
// SiteHeader/SiteFooter は pathPrefix を「言語ホームへの相対」として使う
// (画像は ${pathPrefix}../images/...、privacy-policy は ${pathPrefix}../privacy-policy/)。
// /privacy-policy/ja/index.html から /ja/ 言語ホームに戻るには ../../ja/
const PREFIX = "../../or-IN/";
const ACCENT = "#E89A3D";
const ACCENT_DEEP = "#8B5A1A";

function Card({ label, children }) {
  return (
    <section className="reveal" style={{ padding: "0 18px", maxWidth: 640, margin: "28px auto" }}>
      <div style={{
        position: "relative",
        border: `2px solid ${ACCENT}`,
        borderRadius: 16,
        padding: "32px 24px 24px",
        background: "#fff",
      }}>
        <div style={{ position: "absolute", top: -11, left: 20, pointerEvents: "none" }}>
          <span style={{
            display: "inline-block",
            background: "#FBF6EE",
            padding: "2px 14px",
            borderRadius: 999,
            fontSize: 13, fontWeight: 800, letterSpacing: 3,
            color: ACCENT_DEEP,
          }}>{label}</span>
        </div>
        {children}
      </div>
    </section>
  );
}

function Promise3() {

  const items = [
    { k: "01", t: "ଆମେ ବିଜ୍ଞାପନ ପରିଚୟ (IDFA) ସଂଗ୍ରହ କରୁ ନାହିଁ", d: "ଆପଣଙ୍କ ଆପ୍ ବ୍ୟବହାର କୌଣସି ବିଜ୍ଞାପନ ନେଟ୍‌ୱର୍କ ସହ ଯୋଡ଼ାଯାଏ ନାହିଁ." },
    { k: "02", t: "ଆପଣଙ୍କ ତଥ୍ୟ ଉପକରଣରେ ରହେ", d: "ରେକର୍ଡ ଓ ସେଟିଂ ଉପକରଣରେ ହିଁ ସଂରକ୍ଷିତ, ବାହ୍ୟ ସର୍ଭର‌କୁ କେବେ ପଠାଯାଏ ନାହିଁ." },
    { k: "03", t: "ସଂଗ୍ରହ ନ କରିବାକୁ ଡିଜାଇନ୍", d: "ସୁବିଧା ବଦଳରେ ତଥ୍ୟ ନୁହେଁ — ତଥ୍ୟ ସଂଗ୍ରହ ବିନା ଚାଲୁଥିବା ଆପ୍ ଆମେ ତିଆରି କରୁ." },
  ];
  return (
    <section className="reveal" style={{ padding: "0 18px", maxWidth: 640, margin: "32px auto 8px" }}>
      <div style={{
        background: "linear-gradient(180deg, #FFF8EC 0%, #FFEFD4 100%)",
        border: `2px solid ${ACCENT}`,
        borderRadius: 18,
        padding: "26px 22px 22px",
      }}>
        <div style={{ textAlign: "center", marginBottom: 18 }}>
          <div style={{ fontSize: 11, letterSpacing: 4, fontWeight: 800, color: ACCENT_DEEP, marginBottom: 6 }}>— ଆମର 3ଟି ପ୍ରତିଶ୍ରୁତି —</div>
          <div style={{ fontSize: 18, fontWeight: 900, color: "#3D2E1F", lineHeight: 1.5 }}>
            ଆପଣଙ୍କ ଶାନ୍ତି ପାଇଁ,<br />
            <span style={{ color: ACCENT_DEEP }}>ଆମେ ଯାହା ଦେଉ</span>
          </div>
        </div>
        <ul style={{ listStyle: "none", padding: 0, margin: 0, display: "flex", flexDirection: "column", gap: 12 }}>

              boxShadow: "0 1px 3px rgba(0,0,0,0.05)",

                fontSize: 11, fontWeight: 800, letterSpacing: 1,
                color: "#fff", background: ACCENT,
                padding: "3px 8px", borderRadius: 6,
              }}>{it.k}</span>

            <li>ଅନ୍ୟ ଆପ୍‌ରେ Google AdMob ବିଜ୍ଞାପନ କେବଳ ବାପା-ମା ପରିଚାଳନା ସ୍କ୍ରିନ୍‌ରେ ଦେଖାଯିବ, ପିଲା ବ୍ୟବହାର କରୁଥିବା ସ୍କ୍ରିନ୍‌ରେ କେବେ ନୁହେଁ.</li>
            <li>AdMob ସହ ମଧ୍ୟ ଆମ ଆପ୍ ବିଜ୍ଞାପନ ପରିଚୟ (IDFA) ପଠାଇବାକୁ କନଫିଗର୍ ହୋଇନଥାନ୍ତି.</li>
          </ul>
        </Card>

        <Card label="ବିଶ୍ଳେଷଣ ଏବଂ ଟ୍ରାକିଂ">
          <ul style={{ margin: 0, paddingLeft: 20, color: "#5C4936", fontSize: 14, lineHeight: 1.85 }}>
            <li>ପିଲାଙ୍କ ଆପ୍‌ରେ କୌଣସି ବିଶ୍ଳେଷଣ କିମ୍ବା ଟ୍ରାକିଂ ଉପକରଣ ବ୍ୟବହାର ହୁଏ ନାହିଁ.</li>
            <li>ଅନ୍ୟ ଆପ୍‌ରେ Apple ର ନାମହୀନ ପରିସଂଖ୍ୟାନ କେବଳ ସମସ୍ୟା ଚିହ୍ନଟ ଓ ଗୁଣବତ୍ତା ବୃଦ୍ଧି ପାଇଁ — ବ୍ୟକ୍ତିଗତ ତଥ୍ୟ ବିନା.</li>
          </ul>
        </Card>

        <Card label="ତୃତୀୟ ପକ୍ଷ ସହ ଅଂଶଗ୍ରହଣ">

            ଆପଣଙ୍କ ତଥ୍ୟ ଆମେ ବିକ୍ରୟ କରୁନାହିଁ କିମ୍ବା ତୃତୀୟ ପକ୍ଷ ସହ ସେୟାର କରୁନାହିଁ.
          </p>
        </Card>

        <Card label="ସମ୍ପର୍କ">
          <p style={{ margin: 0, fontSize: 14, color: "#5C4936", lineHeight: 1.85 }}>
            ପ୍ରଶ୍ନ କିମ୍ବା ଅନୁରୋଧ ପାଇଁ <strong style={{ color: "#3D2E1F" }}>lycopenecafei+LP@gmail.com</strong>‌ରେ ଯୋଗାଯୋଗ କରନ୍ତୁ. କୌଣସି ଆପ୍‌ର App Store ପୃଷ୍ଠା ମାଧ୍ୟମରେ ମଧ୍ୟ ପହଞ୍ଚିହେବ.
          </p>
        </Card>

        <Card label="ଅଦ୍ୟତନ">
          <p style={{ margin: "0 0 8px", fontSize: 14, color: "#5C4936", lineHeight: 1.85 }}>
            ଆବଶ୍ୟକ ସମୟରେ ଏହି ନୀତି ଅଦ୍ୟତନ କରାଯାଇପାରେ. ଗୁରୁତ୍ୱପୂର୍ଣ୍ଣ ପରିବର୍ତ୍ତନ ଏହି ପୃଷ୍ଠାରେ ଜଣାଯିବ.
          </p>
          <p style={{ margin: 0, fontSize: 12, opacity: 0.55, fontVariantNumeric: "tabular-nums" }}>
            ଶେଷ ଅଦ୍ୟତନ: 2026-05-11
          </p>
        </Card>
      </main>

      <window.SiteFooter pathPrefix={PREFIX} />
    </>
  );
}

createRoot(document.getElementById("root")).render(<Page />);

</script>

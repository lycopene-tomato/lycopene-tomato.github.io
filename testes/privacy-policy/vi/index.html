<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>Chính sách quyền riêng tư — Lyco App</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Chính sách quyền riêng tư chung của các ứng dụng Lyco. Chúng tôi không thu thập định danh quảng cáo; dữ liệu của bạn nằm trên thiết bị." />
<link rel="stylesheet" href="../../shared/motion.css" />
<style>
  body { margin: 0; font-family: "Helvetica Neue", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif; background: #FBF6EE; color: #3D2E1F; }
  * { box-sizing: border-box; }
  .site-header-inner { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; gap: 12px; max-width: 1200px; margin: 0 auto; }
  .site-nav { flex: 1; justify-content: center; }
  @media (max-width: 900px) {
    .site-nav { display: none !important; }
    .site-menu-btn { display: block !important; }
  }
  .reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.visible { opacity: 1; transform: none; }
</style>
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="../../favicon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png" />
</head>
<body>
<div id="root"></div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<!-- Motion -->
<script src="../../shared/motion.js" defer></script>

<!-- 言語メタ -->
<script src="../../shared/langs.js"></script>

<!-- コンテンツ (SiteHeader/SiteFooter が I18N を参照するため必要) -->
<script src="../../content/ja/common.js"></script>
<script src="../../content/ja/todo.js"></script>
<script src="../../content/ja/record.js"></script>
<script src="../../content/ja/tool.js"></script>
<script src="../../content/ja/other.js"></script>
<script>window.__CONTENT__ = window.__CONTENT__ || {}; window.__CONTENT__._fb_lang = "ja";</script>
<script src="../../content/ja/common.js"></script>
<script src="../../content/ja/todo.js"></script>
<script src="../../content/ja/record.js"></script>
<script src="../../content/ja/tool.js"></script>
<script src="../../content/ja/other.js"></script>

<script src="../../shared/i18n-loader.js"></script>

<!-- 共通コンポーネント -->
<script type="text/babel" src="../../shared/site-shared.jsx"></script>

<!-- ページ本体 -->
<script type="text/babel" data-presets="env,react">

const { createRoot } = ReactDOM;
// SiteHeader/SiteFooter は pathPrefix を「言語ホームへの相対」として使う
// (画像は ${pathPrefix}../images/...、privacy-policy は ${pathPrefix}../privacy-policy/)。
// /privacy-policy/ja/index.html から /ja/ 言語ホームに戻るには ../../ja/
const PREFIX = "../../vi/";
const ACCENT = "#E89A3D";
const ACCENT_DEEP = "#8B5A1A";

function Card({ label, children }) {
  return (
    <section className="reveal" style={{ padding: "0 18px", maxWidth: 640, margin: "28px auto" }}>
      <div style={{
        position: "relative",
        border: `2px solid ${ACCENT}`,
        borderRadius: 16,
        padding: "32px 24px 24px",
        background: "#fff",
      }}>
        <div style={{ position: "absolute", top: -11, left: 20, pointerEvents: "none" }}>
          <span style={{
            display: "inline-block",
            background: "#FBF6EE",
            padding: "2px 14px",
            borderRadius: 999,
            fontSize: 13, fontWeight: 800, letterSpacing: 3,
            color: ACCENT_DEEP,
          }}>{label}</span>
        </div>
        {children}
      </div>
    </section>
  );
}

function Promise3() {
  // 冒頭の "3つの約束" ハイライト
  const items = [
    { k: "01", t: "Chúng tôi không thu thập định danh quảng cáo (IDFA)", d: "Việc sử dụng ứng dụng không bao giờ được liên kết với bất kỳ mạng quảng cáo nào." },
    { k: "02", t: "Dữ liệu của bạn nằm trên thiết bị", d: "Bản ghi và thiết lập chỉ lưu trên thiết bị, không bao giờ gửi tới máy chủ bên ngoài." },
    { k: "03", t: "Thiết kế để không thu thập", d: "Chúng tôi xây ứng dụng để hoạt động mà không cần thu thập dữ liệu, thay vì đánh đổi dữ liệu lấy tiện ích." },
  ];
  return (
    <section className="reveal" style={{ padding: "0 18px", maxWidth: 640, margin: "32px auto 8px" }}>
      <div style={{
        background: "linear-gradient(180deg, #FFF8EC 0%, #FFEFD4 100%)",
        border: `2px solid ${ACCENT}`,
        borderRadius: 18,
        padding: "26px 22px 22px",
      }}>
        <div style={{ textAlign: "center", marginBottom: 18 }}>
          <div style={{ fontSize: 11, letterSpacing: 4, fontWeight: 800, color: ACCENT_DEEP, marginBottom: 6 }}>— 3 cam kết của chúng tôi —</div>
          <div style={{ fontSize: 18, fontWeight: 900, color: "#3D2E1F", lineHeight: 1.5 }}>
            Để bạn yên tâm,<br />
            <span style={{ color: ACCENT_DEEP }}>điều chúng tôi cam kết</span>
          </div>
        </div>
        <ul style={{ listStyle: "none", padding: 0, margin: 0, display: "flex", flexDirection: "column", gap: 12 }}>
          {items.map((it) => (
            <li key={it.k} style={{
              display: "flex", gap: 14, alignItems: "flex-start",
              padding: "12px 14px", background: "#fff", borderRadius: 12,
              boxShadow: "0 1px 3px rgba(0,0,0,0.05)",
            }}>
              <span style={{
                flex: "0 0 auto",
                fontFamily: "ui-monospace, monospace",
                fontSize: 11, fontWeight: 800, letterSpacing: 1,
                color: "#fff", background: ACCENT,
                padding: "3px 8px", borderRadius: 6,
              }}>{it.k}</span>
              <div>
                <div style={{ fontSize: 14, fontWeight: 800, color: "#3D2E1F", marginBottom: 2 }}>{it.t}</div>
                <div style={{ fontSize: 12.5, color: "#5C4936", lineHeight: 1.6 }}>{it.d}</div>
              </div>
            </li>
          ))}
        </ul>
      </div>
    </section>
  );
}

function Page() {
  return (
    <>
      <window.SiteHeader pathPrefix={PREFIX} currentCategoryId="todo" />

      {/* HERO */}
      <section className="reveal" style={{
        background: "#2C2218", color: "#FBF6EE",
        padding: "36px 20px 30px", textAlign: "center",
      }}>
        <div style={{ maxWidth: 720, margin: "0 auto" }}>
          <h1 style={{ margin: "0 0 8px", fontSize: 26, fontWeight: 900, letterSpacing: 1 }}>Chính sách quyền riêng tư</h1>
          <p style={{ margin: 0, fontSize: 13, opacity: 0.7 }}>Cho tất cả ứng dụng Lyco</p>
        </div>
      </section>

      {/* 3つの約束 (冒頭ハイライト) */}
      <Promise3 />

      {/* 詳細セクション */}
      <main style={{ paddingBottom: 48 }}>
        <Card label="PHẠM VI">
          <p style={{ margin: 0, fontSize: 14, color: "#5C4936", lineHeight: 1.85 }}>
            Chính sách này áp dụng cho mọi ứng dụng do Lyco App cung cấp. Trang này, được liên kết từ trang App Store của mỗi ứng dụng, đồng thời là chính sách quyền riêng tư của ứng dụng đó.
          </p>
        </Card>

        <Card label="THÔNG TIN CHÚNG TÔI THU THẬP">
          <ul style={{ margin: 0, paddingLeft: 20, color: "#5C4936", fontSize: 14, lineHeight: 1.85 }}>
            <li>Thiết lập, tiến độ và bản ghi của ứng dụng chỉ được lưu trên thiết bị của bạn.</li>
            <li>Dữ liệu này không bao giờ được gửi tới máy chủ của chúng tôi hay bất kỳ dịch vụ bên ngoài nào.</li>
            <li>Chúng tôi không thu thập dữ liệu định danh cá nhân (họ tên, email, số điện thoại…).</li>
          </ul>
        </Card>

        <Card label="VỀ QUẢNG CÁO">
          <ul style={{ margin: 0, paddingLeft: 20, color: "#5C4936", fontSize: 14, lineHeight: 1.85 }}>
            <li>Ứng dụng dành cho trẻ em hoàn toàn không hiển thị quảng cáo.</li>
            <li>Với các ứng dụng khác, quảng cáo Google AdMob chỉ có thể xuất hiện trên màn hình quản lý của phụ huynh, không bao giờ xuất hiện trên màn hình trẻ em sử dụng.</li>
            <li>Ngay cả với AdMob, ứng dụng của chúng tôi được cấu hình để không truyền định danh quảng cáo (IDFA).</li>
          </ul>
        </Card>

        <Card label="PHÂN TÍCH & THEO DÕI">
          <ul style={{ margin: 0, paddingLeft: 20, color: "#5C4936", fontSize: 14, lineHeight: 1.85 }}>
            <li>Ứng dụng cho trẻ em không sử dụng bất kỳ công cụ phân tích hay theo dõi nào.</li>
            <li>Với các ứng dụng khác, chúng tôi chỉ dùng số liệu thống kê ẩn danh của Apple để phát hiện sự cố và cải thiện chất lượng — không có dữ liệu định danh.</li>
          </ul>
        </Card>

        <Card label="CHIA SẺ VỚI BÊN THỨ BA">
          <p style={{ margin: 0, fontSize: 14, color: "#5C4936", lineHeight: 1.85 }}>
            Chúng tôi không bán hay chia sẻ thông tin của bạn với bên thứ ba.
          </p>
        </Card>

        <Card label="LIÊN HỆ">
          <p style={{ margin: 0, fontSize: 14, color: "#5C4936", lineHeight: 1.85 }}>
            Mọi câu hỏi hoặc yêu cầu, vui lòng liên hệ <strong style={{ color: "#3D2E1F" }}>lycopenecafei+LP@gmail.com</strong>. Bạn cũng có thể liên hệ qua trang App Store của bất kỳ ứng dụng nào.
          </p>
        </Card>

        <Card label="CẬP NHẬT">
          <p style={{ margin: "0 0 8px", fontSize: 14, color: "#5C4936", lineHeight: 1.85 }}>
            Chúng tôi có thể cập nhật chính sách này khi cần. Các thay đổi quan trọng sẽ được thông báo trên trang này.
          </p>
          <p style={{ margin: 0, fontSize: 12, opacity: 0.55, fontVariantNumeric: "tabular-nums" }}>
            Cập nhật lần cuối: 2026-05-11
          </p>
        </Card>
      </main>

      <window.SiteFooter pathPrefix={PREFIX} />
    </>
  );
}

createRoot(document.getElementById("root")).render(<Page />);

</script>

<script defer src="../../shared/analytics.js"></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>

<meta name="robots" content="noindex,nofollow" />

<link rel="canonical" href="https://lycoapp.com/ja/in-app/apps.html" />

<script type="text/babel" data-presets="env,react">
const { createRoot } = ReactDOM;
createRoot(document.getElementById("root")).render(<window.InAppAppsPage />);

<script defer src="../../shared/analytics.js"></script>

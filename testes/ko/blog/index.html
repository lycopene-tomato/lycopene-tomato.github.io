<style>

  .wrap { max-width:720px; margin:0 auto; padding:32px 18px 60px; }
  h1 { font-size:26px; font-weight:900; margin:0 0 8px; }

  .section-label.app { color:#3F8C7E; }
  .posts { display:grid; gap:14px; list-style:none; padding:0; margin:0; }
  .post { display:block; background:#fff; border:1px solid #eee; border-radius:14px; padding:18px 20px; text-decoration:none; color:inherit; transition: transform .15s ease, box-shadow .15s ease; }
  .post:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.06); }

  .post .excerpt { font-size:13px; opacity:.75; line-height:1.7; }
  .post .app-badge { display:inline-block; font-size:10px; font-weight:800; letter-spacing:1.5px; color:#fff; background:#3F8C7E; padding:3px 10px; border-radius:999px; margin-bottom:8px; }
  .post.pinned { background: linear-gradient(180deg, #FFF8EC 0%, #FFEFD4 100%); border: 2px solid #E89A3D; }
  .post.pinned .pin-badge { display:inline-block; font-size:10px; font-weight:800; letter-spacing:2px; color:#fff; background:#E89A3D; padding:3px 10px; border-radius:999px; margin-bottom:10px; }
  .post.pinned .title { font-size: 18px; }
  .posts.slim { gap: 4px; }
  .post.slim { padding: 10px 14px; display: flex; align-items: center; gap: 10px; border-radius: 8px; border: 1px solid #eee; }
  .post.slim .date { font-size:10px; opacity:.45; margin-bottom:0; min-width: 64px; flex-shrink: 0; }
  .post.slim .title { font-size:14px; font-weight:700; line-height:1.4; margin-bottom:0; flex: 1; }
  .post.slim .excerpt { display: none; }
  .post.slim .app-badge { margin-bottom:0; min-width: 72px; text-align: center; flex-shrink: 0; font-size: 9px; padding: 3px 8px; }
  .post.app-post { border-left: 4px solid #3F8C7E; background:#FBFAF5; }
  .post.slim.app-post { flex-direction: column; align-items: flex-start; gap: 6px; }
  .post.slim.app-post .app-badge { min-width: 0; }
  .site-header-inner { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; gap: 12px; max-width: 1200px; margin: 0 auto; }
  .site-nav { flex: 1; justify-content: center; }
  @media (max-width: 900px) { .site-nav { display: none !important; } .site-menu-btn { display: block !important; } }

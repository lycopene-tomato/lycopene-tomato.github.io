<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Lyco App</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="An indie app series. Play × Tasks = Habit." />
<link rel="canonical" href="/en-US/" />
<style>
  body { font-family: system-ui, sans-serif; background: #FBF6EE; color: #3D2E1F; padding: 40px 20px; text-align: center; }
  a { color: #E89A3D; }
</style>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
</head>
<body>

<!--
  ============================================================
   ルート index.html — UA判定リダイレクタ
  ============================================================
   - Accept-Language を見て /<lang>/ にリダイレクト
   - localStorage に保存された言語があればそれを優先
   - フォールバックは /en/
  ============================================================
-->

<noscript>
  <p>Please enable JavaScript, or go to <a href="/en-US/">English site</a> / <a href="/ja/">日本語サイト</a>.</p>
</noscript>

<p id="msg">Redirecting…</p>

<script src="shared/langs.js"></script>
<script>
(function () {
  var saved = null;
  try { saved = localStorage.getItem("lp_lang"); } catch (e) {}
  var lang;
  if (saved && window.LANGS.some(function (l) { return l.code === saved; })) {
    lang = saved;
  } else {
    lang = window.matchLang(navigator.languages ? navigator.languages.join(",") : navigator.language);
  }
  // /<lang>/ がまだ作られていない言語は en-US にフォールバック
  // GitHub Pages では未存在パスは404になるので、安全側に倒す
  var EXISTING = ["ja", "en-US", "zh-Hans", "zh-Hant", "ko", "es-ES", "es-MX", "fr-FR", "fr-CA", "de-DE", "pt-BR", "pt-PT", "it", "nl-NL", "ru", "pl", "tr", "ar-SA", "he", "hi", "th", "vi", "id", "ms", "sv", "no", "da", "fi", "cs", "sk", "hu", "ro", "el", "hr", "uk", "ca", "sl-SI", "ur-PK", "bn-BD", "gu-IN", "kn-IN", "ml-IN", "mr-IN", "or-IN", "pa-IN", "ta-IN", "te-IN"]; // ★ 言語ディレクトリを追加したらここに足す
  if (EXISTING.indexOf(lang) === -1) {
    // matchLang() で既に主区別ロケール (en-US 等) に変換されてるはずだが念のため
    var primary = lang.split("-")[0];
    var found = null;
    for (var i = 0; i < EXISTING.length; i++) {
      if (EXISTING[i].split("-")[0] === primary) { found = EXISTING[i]; break; }
    }
    lang = found || "en-US";
  }
  location.replace("/" + lang + "/");
})();
</script>

<script defer src="shared/analytics.js"></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>遊び × やる事 = 習慣 — 子どもが自分から動き出すTodoアプリ</title>
<meta name="description" content="遊びの仕掛けで、子どもが自分から動き出すTodoアプリシリーズ。ガチャ、ビンゴ、すごろく、農園、WBS。" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta property="og:title" content="遊び × やる事 = 習慣" />
<meta property="og:description" content="子どもが自分から動き出すTodoアプリシリーズ" />
<meta property="og:type" content="website" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
  /* ====================================================
     グローバル
  ==================================================== */
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: #FBF6EE;
    font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif;
    -webkit-font-smoothing: antialiased;
    text-size-adjust: 100%;
    -webkit-text-size-adjust: 100%;
  }
  img, svg { max-width: 100%; }
  a { color: inherit; }

  /* ====================================================
     ヘッダー（共通）
  ==================================================== */
  .site-header-inner {
    max-width: 1280px; margin: 0 auto;
    padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
  }

  /* ====================================================
     Hero タイトル — 流体タイポグラフィ
  ==================================================== */
  .hero-title {
    font-size: clamp(48px, 9vw, 88px);
    line-height: 1.2;
  }
  .hero-sub {
    font-size: clamp(15px, 2.4vw, 18px);
    line-height: 2;
  }

  /* ====================================================
     アプリ一覧グリッド — 自動列数
     320pxを下限に auto-fill。アプリが増えても勝手に複数行に。
  ==================================================== */
  .lineup-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 28px;
  }
  .app-card { transition: transform .2s, box-shadow .2s; }
  .app-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 24px -8px rgba(189,153,108,0.3);
  }

  /* ====================================================
     詳細ページのヒーロー
     PC: 横並び 1.1fr 1fr / SP: 縦積み
  ==================================================== */
  .detail-hero {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 80px;
    align-items: center;
  }
  .detail-prevnext {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  /* ====================================================
     レスポンシブブレークポイント
     - 1024px以下: タブレット
     -  768px以下: スマホ
  ==================================================== */
  @media (max-width: 1024px) {
    .detail-hero { gap: 48px; }
  }

  @media (max-width: 768px) {
    .site-header-inner { padding: 12px 20px; }
    .site-nav { display: none !important; }      /* ナビは隠してメニューに */
    .site-menu-btn { display: block !important; } /* ハンバーガーを表示 */

    .deco-only-pc { display: none; }              /* 装飾SVG非表示 */

    .detail-hero { grid-template-columns: 1fr; gap: 32px; }
    .detail-prevnext { grid-template-columns: 1fr; }

    /* カードグリッドも1列寄りに */
    .lineup-grid {
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
  }

  @media (max-width: 480px) {
    .lineup-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- ============================================================
     React + Babel（CDN, バージョン固定）
============================================================ -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- ============================================================
     アプリのソース。読み込み順は依存関係の順。
     1. i18n.js          : 文面とアプリデータ
     2. app-mocks.jsx    : 各アプリの画面モック
     3. site-shared.jsx  : 共通コンポーネント
     4. page-home.jsx    : このページ本体
============================================================ -->
<script src="i18n.js"></script>
<script type="text/babel" src="app-mocks.jsx"></script>
<script type="text/babel" src="site-shared.jsx"></script>
<script type="text/babel" src="page-home.jsx"></script>

<script type="text/babel">
  // マウント
  ReactDOM.createRoot(document.getElementById('root')).render(<window.HomePage />);
</script>
</body>
</html>

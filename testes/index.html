<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Lyco App</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="An indie app series. Play × Tasks = Habit." />
<link rel="canonical" href="/en/" />
<style>
  body { font-family: system-ui, sans-serif; background: #FBF6EE; color: #3D2E1F; padding: 40px 20px; text-align: center; }
  a { color: #E89A3D; }
</style>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
</head>
<body>

<!--
  ============================================================
   ルート index.html — UA判定リダイレクタ
  ============================================================
   - Accept-Language を見て /<lang>/ にリダイレクト
   - localStorage に保存された言語があればそれを優先
   - フォールバックは /en/
  ============================================================
-->

<noscript>
  <p>Please enable JavaScript, or go to <a href="/en/">English site</a> / <a href="/ja/">日本語サイト</a>.</p>
</noscript>

<p id="msg">Redirecting…</p>

<script src="shared/langs.js"></script>
<script>
(function () {
  var saved = null;
  try { saved = localStorage.getItem("lp_lang"); } catch (e) {}
  var lang;
  if (saved && window.LANGS.some(function (l) { return l.code === saved; })) {
    lang = saved;
  } else {
    lang = window.matchLang(navigator.languages ? navigator.languages.join(",") : navigator.language);
  }
  // /<lang>/ がまだ作られていない言語は en にフォールバック
  // GitHub Pages では未存在パスは404になるので、安全側に倒す
  var EXISTING = ["ja", "en"]; // ★ 言語ディレクトリを追加したらここに足す
  if (EXISTING.indexOf(lang) === -1) {
    var primary = lang.split("-")[0];
    if (EXISTING.indexOf(primary) >= 0) lang = primary; else lang = "en";
  }
  location.replace("/" + lang + "/");
})();
</script>

<script defer src="shared/analytics.js"></script>
</body>
</html>

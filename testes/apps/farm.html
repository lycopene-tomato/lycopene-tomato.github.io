<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>farm | 遊び × やる事 = 習慣</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: #FBF6EE;
    font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  img, svg { max-width: 100%; }
  a { color: inherit; }

  .site-header-inner {
    max-width: 1280px; margin: 0 auto;
    padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
  }

  .lineup-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 28px;
  }

  .detail-hero {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 80px;
    align-items: center;
  }
  .detail-prevnext {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 1024px) {
    .detail-hero { gap: 48px; }
  }
  @media (max-width: 768px) {
    .site-header-inner { padding: 12px 20px; }
    .site-nav { display: none !important; }
    .site-menu-btn { display: block !important; }
    .deco-only-pc { display: none; }
    .detail-hero { grid-template-columns: 1fr; gap: 32px; }
    .detail-prevnext { grid-template-columns: 1fr; }
    .lineup-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  }
  @media (max-width: 480px) {
    .lineup-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- 親ディレクトリのスクリプトを参照 -->
<script src="../i18n.js"></script>
<script type="text/babel" src="../app-mocks.jsx"></script>
<script type="text/babel" src="../site-shared.jsx"></script>
<script type="text/babel" src="../page-detail.jsx"></script>

<script type="text/babel">
  // ★このアプリのIDを指定（apps[]配列のidと一致させること）
  ReactDOM.createRoot(document.getElementById('root')).render(<window.AppDetailPage appId="farm" />);
</script>
</body>
</html>
